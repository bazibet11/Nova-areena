<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet Game</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:#fff;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    background:#111;
}
.logo{
    font-size:20px;
    font-weight:bold;
    color:#00f2fe;
}

/* BANNER */
.banner{
    width:100%;
    height:150px;
    background:url("https://images.unsplash.com/photo-1606813909355-d1b0c0b3bcd5") center/cover;
    border-radius:10px;
    margin:10px 0;
}

/* CATEGORY */
.categories{
    display:flex;
    overflow-x:auto;
    padding:10px;
    gap:10px;
}
.cat{
    min-width:80px;
    padding:10px;
    background:#1a1a1a;
    border-radius:10px;
    text-align:center;
    font-size:12px;
}

/* GAMES GRID */
.games{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}
.game{
    background:#1a1a1a;
    border-radius:12px;
    overflow:hidden;
    text-align:center;
}
.game img{
    width:100%;
    height:120px;
    object-fit:cover;
}
.game p{
    margin:5px;
    font-size:13px;
}

/* FOOTER MENU */
.footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
}
.footer div{
    text-align:center;
    font-size:12px;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">🎮 BAZI BET</div>
<div>💰 1000</div>
</div>

<div class="banner"></div>

<!-- CATEGORY -->
<div class="categories">
<div class="cat">👑 Popular</div>
<div class="cat">🚀 Crash</div>
<div class="cat">⚽ Sports</div>
<div class="cat">🎰 Slots</div>
</div>

<!-- GAMES -->
<div class="games">

<div class="game">
<img src="https://via.placeholder.com/200x120?text=Aviator">
<p>Aviator</p>
</div>

<div class="game">
<img src="https://via.placeholder.com/200x120?text=Fortune">
<p>Fortune 500</p>
</div>

<div class="game">
<img src="https://via.placeholder.com/200x120?text=Gems">
<p>Fortune Gems</p>
</div>

<div class="game">
<img src="https://via.placeholder.com/200x120?text=Wheel">
<p>Money Wheel</p>
</div>

<div class="game">
<img src="https://via.placeholder.com/200x120?text=Money">
<p>Money Coming</p>
</div>

<div class="game">
<img src="https://via.placeholder.com/200x120?text=Diva">
<p>Diva Game</p>
</div>

</div>

<!-- FOOTER -->
<div class="footer">
<div>🏠<br>Home</div>
<div>🎮<br>Casino</div>
<div>🎰<br>Slots</div>
<div>🎁<br>Promo</div>
</div>

</body>
</html>
