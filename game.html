<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:sans-serif;
}

.header{
display:flex;
justify-content:space-between;
padding:15px;
background:#111;
}

.logo{color:#00f0ff;font-weight:bold;}
.money{color:gold;}

.banner img{
width:100%;
border-radius:10px;
}

.categories{
display:flex;
overflow:auto;
padding:10px;
gap:10px;
}

.cat{
background:#222;
padding:10px 15px;
border-radius:20px;
}

.game-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.game{
background:#111;
border-radius:10px;
overflow:hidden;
}

.game img{
width:100%;
height:120px;
object-fit:cover;
}

.name{text-align:center;padding:5px;}
</style>
</head>

<body>

<div class="header">
<div class="logo">🎮 BAZI BET</div>
<div class="money">💰 1000</div>
</div>

<div class="banner">
<img src="https://images.unsplash.com/photo-1596838132731-3301c3fd4317">
</div>

<div class="categories">
<div class="cat">👑 Popular</div>
<div class="cat">🚀 Crash</div>
<div class="cat">⚽ Sports</div>
<div class="cat">🎰 Slots</div>
</div>

<div class="game-grid" id="games"></div>

<script>
fetch("games.json")
.then(res=>res.json())
.then(data=>{
let g=document.getElementById("games");

data.forEach(x=>{
g.innerHTML+=`
<div class="game">
<img src="${x.img}">
<div class="name">${x.name}</div>
</div>
`;
});
});
</script>

</body>
</html>
