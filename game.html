<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:#fff;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    padding:12px;
    background:#111;
}
.logo{
    color:#00f2fe;
    font-weight:bold;
    font-size:20px;
}

/* SLIDER */
.banner{
    width:95%;
    height:140px;
    margin:10px auto;
    border-radius:12px;
    background:url("https://images.unsplash.com/photo-1511512578047-dfb367046420") center/cover;
}

/* CATEGORY */
.categories{
    display:flex;
    gap:10px;
    padding:10px;
    overflow-x:auto;
}
.cat{
    background:#1a1a1a;
    padding:10px 15px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

/* GAMES GRID */
.games{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:10px;
}
.game{
    background:#1a1a1a;
    border-radius:12px;
    overflow:hidden;
    text-align:center;
}
.game img{
    width:100%;
    height:120px;
    object-fit:cover;
}
.game p{
    margin:6px;
}

/* FOOTER */
.footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
}
.footer div{
    font-size:12px;
    text-align:center;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="logo">🎮 BAZI BET</div>
<div>💰 1000</div>
</div>

<!-- BANNER -->
<div class="banner"></div>

<!-- CATEGORY -->
<div class="categories">
<div class="cat">👑 Popular</div>
<div class="cat">🚀 Crash</div>
<div class="cat">⚽ Sports</div>
<div class="cat">🎰 Slots</div>
</div>

<!-- GAMES -->
<div class="games">

<div class="game" onclick="openGame('Aviator')">
<img src="https://picsum.photos/200/120?random=1">
<p>Aviator</p>
</div>

<div class="game" onclick="openGame('Fortune 500')">
<img src="https://picsum.photos/200/120?random=2">
<p>Fortune 500</p>
</div>

<div class="game" onclick="openGame('Fortune Gems')">
<img src="https://picsum.photos/200/120?random=3">
<p>Fortune Gems</p>
</div>

<div class="game" onclick="openGame('Money Wheel')">
<img src="https://picsum.photos/200/120?random=4">
<p>Money Wheel</p>
</div>

<div class="game" onclick="openGame('Money Coming')">
<img src="https://picsum.photos/200/120?random=5">
<p>Money Coming</p>
</div>

<div class="game" onclick="openGame('Diva Game')">
<img src="https://picsum.photos/200/120?random=6">
<p>Diva Game</p>
</div>

</div>

<!-- FOOTER -->
<div class="footer">
<div>🏠<br>Home</div>
<div>🎮<br>Casino</div>
<div>🎰<br>Slots</div>
<div>🎁<br>Promo</div>
</div>

<script>
function openGame(name){
    alert("Opening " + name);
}
</script>

</body>
</html>
