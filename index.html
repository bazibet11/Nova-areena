<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bazi Bet</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* BACKGROUND */
body{
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:#111;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#00f2fe;
}

/* TOP TEXT */
.hero{
    padding:20px;
}

.hero h2{
    font-size:22px;
    color:#ccc;
}

/* TABS */
.tabs{
    display:flex;
    border-bottom:1px solid #333;
}

.tab{
    flex:1;
    text-align:center;
    padding:12px;
    cursor:pointer;
    color:#aaa;
}

.tab.active{
    color:#00f2fe;
    border-bottom:2px solid #00f2fe;
}

/* FORM */
.form{
    padding:20px;
}

.input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#1c1c1c;
    color:#fff;
}

.input::placeholder{
    color:#777;
}

/* BUTTON */
.btn{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(45deg,#00c6ff,#00f2fe);
    color:#000;
    cursor:pointer;
}

/* LINK */
.link{
    text-align:right;
    margin-top:8px;
    color:#00f2fe;
    font-size:14px;
    cursor:pointer;
}

/* HIDE */
.hidden{
    display:none;
}
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">Ba<span>zi</span> Bet</div>
    <div>🏠</div>
</div>

<!-- HERO -->
<div class="hero">
    <h2>Hello<br>Welcome to BJ</h2>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" onclick="showTab('login')">Log in</div>
    <div class="tab" onclick="showTab('signup')">Sign up</div>
</div>

<!-- LOGIN -->
<div id="login" class="form">
    <input class="input" id="loginUser" placeholder="Enter your username">
    <input class="input" type="password" id="loginPass" placeholder="Enter your password">

    <div class="link">Forgot password?</div>

    <button class="btn" onclick="login()">Log in 🚀</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="form hidden">

    <input class="input" placeholder="Affiliate Code (optional)">
    <input class="input" id="signupUser" placeholder="Username">

    <input class="input" placeholder="Currency (PKR)">
    <input class="input" placeholder="Phone Number">

    <input class="input" id="signupPass" type="password" placeholder="Password">

    <div id="captchaText" style="margin-top:10px;"></div>
    <input class="input" id="captchaInput" placeholder="Enter Captcha">

    <button class="btn" onclick="signup()">Continue 🚀</button>

</div>

<script>

/* TAB SWITCH */
function showTab(tab){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('signup').classList.add('hidden');

    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

    document.getElementById(tab).classList.remove('hidden');

    if(tab==="login"){
        document.querySelectorAll('.tab')[0].classList.add('active');
    }else{
        document.querySelectorAll('.tab')[1].classList.add('active');
        generateCaptcha();
    }
}

/* CAPTCHA */
let captcha="";
function generateCaptcha(){
    captcha = Math.floor(1000 + Math.random()*9000);
    document.getElementById("captchaText").innerText = "Captcha: " + captcha;
}

/* LOGIN */
function login(){
    let user = document.getElementById("loginUser").value;
    let pass = document.getElementById("loginPass").value;

    if(user==="" || pass===""){
        alert("Fill all fields");
        return;
    }

    alert("Login Successful 🚀");
}

/* SIGNUP */
function signup(){
    let user = document.getElementById("signupUser").value;
    let pass = document.getElementById("signupPass").value;
    let cap = document.getElementById("captchaInput").value;

    if(user==="" || pass===""){
        alert("Fill all fields");
        return;
    }

    if(cap != captcha){
        alert("Wrong Captcha");
        generateCaptcha();
        return;
    }

    alert("Account Created ✅");
}

</script>

</body>
</html>
