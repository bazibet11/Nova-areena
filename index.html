<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#001f2f,#000);
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:400px;
background:#0a0a0a;
border-radius:20px;
padding:20px;
box-shadow:0 0 20px #00f0ff55;
text-align:center;
}

.logo{
font-size:28px;
color:#00f0ff;
text-shadow:0 0 10px #00f0ff;
margin-bottom:20px;
}

.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.login{background:#00bfff;}
.signup{background:#ff5e00;color:#fff;}

.input-box{
position:relative;
margin-top:10px;
}

.input-box input, select{
width:100%;
padding:10px;
border-radius:10px;
border:none;
background:#111;
color:#fff;
}

.eye{
position:absolute;
right:10px;
top:10px;
cursor:pointer;
}

.form-box{display:none;}

.back{margin-top:10px;color:#aaa;cursor:pointer;}

.dashboard{display:none;text-align:center;}

.captcha{
margin-top:10px;
background:#111;
padding:10px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🎮 BAZI BET</div>

<div id="mainBtns">
<button class="btn login" onclick="showLogin()">LOGIN</button>
<button class="btn signup" onclick="showSignup()">SIGN UP</button>
</div>

<!-- LOGIN -->
<div id="loginForm" class="form-box">
<div class="input-box">
<input id="loginUser" placeholder="Username">
</div>

<div class="input-box">
<input type="password" id="loginPass" placeholder="Password">
<span class="eye" onclick="togglePass('loginPass')">👁</span>
</div>

<div class="captcha" id="loginCaptcha"></div>
<input id="loginCaptchaInput" placeholder="Enter captcha">

<button class="btn login" onclick="login()">ENTER</button>
<div class="back" onclick="goBack()">← Back</div>
</div>

<!-- SIGNUP -->
<div id="signupForm" class="form-box">

<div class="input-box">
<input id="name" placeholder="Full Name">
</div>

<div class="input-box">
<input id="user" placeholder="Username">
</div>

<div class="input-box">
<select id="country">
<option>Pakistan (+92)</option>
<option>India (+91)</option>
<option>UAE (+971)</option>
<option>Bangladesh (+880)</option>
</select>
</div>

<div class="input-box">
<input id="phone" placeholder="Phone Number">
</div>

<div class="input-box">
<input type="password" id="pass" placeholder="Password">
<span class="eye" onclick="togglePass('pass')">👁</span>
</div>

<div class="captcha" id="signupCaptcha"></div>
<input id="signupCaptchaInput" placeholder="Enter captcha">

<button class="btn signup" onclick="signup()">CREATE ACCOUNT</button>
<div class="back" onclick="goBack()">← Back</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
<h2>🎮 Welcome Player</h2>

<button onclick="window.location.href='game.html'" class="btn login">
🎮 PLAY GAME
</button>

<button class="btn signup" onclick="logout()">Logout</button>
</div>

</div>

<script>
let cap1, cap2;

function generateCaptcha(id){
cap1 = Math.floor(Math.random()*10);
cap2 = Math.floor(Math.random()*10);
document.getElementById(id).innerHTML = cap1 + " + " + cap2;
}

function showLogin(){
document.getElementById("mainBtns").style.display="none";
document.getElementById("loginForm").style.display="block";
generateCaptcha("loginCaptcha");
}

function showSignup(){
document.getElementById("mainBtns").style.display="none";
document.getElementById("signupForm").style.display="block";
generateCaptcha("signupCaptcha");
}

function goBack(){
document.getElementById("mainBtns").style.display="block";
document.getElementById("loginForm").style.display="none";
document.getElementById("signupForm").style.display="none";
}

function togglePass(id){
let x = document.getElementById(id);
x.type = x.type === "password" ? "text" : "password";
}

function signup(){
let answer = cap1 + cap2;
let userAns = document.getElementById("signupCaptchaInput").value;

if(userAns != answer){
alert("Captcha wrong");
return;
}

localStorage.setItem("user", document.getElementById("user").value);
localStorage.setItem("pass", document.getElementById("pass").value);

alert("Account created");
goBack();
}

function login(){
let answer = cap1 + cap2;
let userAns = document.getElementById("loginCaptchaInput").value;

if(userAns != answer){
alert("Captcha wrong");
return;
}

let u = document.getElementById("loginUser").value;
let p = document.getElementById("loginPass").value;

if(u == localStorage.getItem("user") && p == localStorage.getItem("pass")){
document.getElementById("loginForm").style.display="none";
document.getElementById("dashboard").style.display="block";
}else{
alert("Wrong login");
}
}

function logout(){
location.reload();
}
</script>

</body>
</html>
