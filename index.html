<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* CONTAINER */
.box{
    width:90%;
    max-width:350px;
    text-align:center;
}

/* LOGO */
.logo{
    font-size:40px;
    margin-bottom:30px;
}
.logo span{color:#00f2fe;}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:linear-gradient(45deg,#2ecc71,#00f2fe);
    color:#0f2027;
    font-weight:bold;
}

/* LINK */
.link{
    margin-top:10px;
    cursor:pointer;
    color:#00f2fe;
}

/* DASHBOARD */
.dashboard{
    display:none;
    text-align:center;
}
</style>
</head>

<body>

<div class="box" id="authBox">
    <div class="logo">Ba<span>z</span>i Bet</div>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <div id="captchaText"></div>
    <input id="captchaInput" placeholder="Enter Captcha">

    <button class="btn" onclick="submit()">Login</button>
    <div class="link" onclick="switchMode()">Create Account</div>
</div>

<!-- DASHBOARD -->
<div class="box dashboard" id="dashboard">
    <h2>Welcome 🎉</h2>
    <p id="welcomeUser"></p>
    <button class="btn" onclick="logout()">Logout</button>
</div>

<script src="app.js"></script>
</body>
</html>
