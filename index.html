<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0f2027, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.card {
    width: 95%;
    max-width: 400px;
    padding: 30px;
    border-radius: 25px;
    background: rgba(0,0,0,0.7);
    box-shadow: 0 0 25px #00c6ff;
    text-align: center;
    color: white;
}

h1 {
    font-size: 36px;
    font-weight: 900;
    margin-bottom: 20px;
    color: #00c6ff;
}

/* BUTTONS */
.btn {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
}

.signup {
    background: linear-gradient(45deg, #ff7b00, #ff3c00);
}

.btn:hover {
    transform: scale(1.05);
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

/* FORM */
.form {
    display: none;
}

/* CAPTCHA */
.captcha-box {
    margin-top: 10px;
    background: #111;
    padding: 10px;
    border-radius: 8px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* BACK */
.back {
    margin-top: 10px;
    cursor: pointer;
    opacity: 0.7;
}

.back:hover {
    opacity: 1;
}

/* DASHBOARD */
.dashboard {
    display: none;
}
</style>
</head>

<body>

<div class="card">

<h1>BAZI BET</h1>

<!-- MAIN -->
<div id="mainBtns">
    <button class="btn login" onclick="showLogin()">LOGIN</button>
    <button class="btn signup" onclick="showSignup()">SIGN UP</button>
</div>

<!-- LOGIN -->
<div id="loginForm" class="form">
    <input type="text" id="luser" placeholder="Username">
    <input type="password" id="lpass" placeholder="Password">
    <button class="btn login" onclick="login()">ENTER</button>
    <div class="back" onclick="goBack()">⬅ Back</div>
</div>

<!-- SIGNUP -->
<div id="signupForm" class="form">
    <input type="text" id="fullname" placeholder="Full Name">
    <input type="text" id="username" placeholder="Username">

    <select id="country">
        <option value="+971">UAE (+971)</option>
        <option value="+880">Bangladesh (+880)</option>
        <option value="+91">India (+91)</option>
        <option value="+92">Pakistan (+92)</option>
    </select>

    <input type="text" id="phone" placeholder="Phone Number">

    <input type="password" id="spass" placeholder="Password">

    <div class="captcha-box" id="captchaText"></div>
    <input type="text" id="captchaInput" placeholder="Enter Captcha">

    <button class="btn signup" onclick="signup()">CREATE ACCOUNT</button>
    <div class="back" onclick="goBack()">⬅ Back</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
    <h2>Welcome 🎉</h2>
    <p id="userData"></p>
    <button class="btn" onclick="logout()">Logout</button>
</div>

</div>

<script>
let captchaAnswer = 0;

function generateCaptcha() {
    let a = Math.floor(Math.random() * 10);
    let b = Math.floor(Math.random() * 10);
    captchaAnswer = a + b;
    document.getElementById("captchaText").innerText = a + " + " + b;
}

function showLogin() {
    hideAll();
    document.getElementById("loginForm").style.display = "block";
}

function showSignup() {
    hideAll();
    document.getElementById("signupForm").style.display = "block";
    generateCaptcha();
}

function signup() {
    let name = document.getElementById("fullname").value.trim();
    let user = document.getElementById("username").value.trim();
    let country = document.getElementById("country").value;
    let phone = document.getElementById("phone").value.trim();
    let pass = document.getElementById("spass").value.trim();
    let captcha = document.getElementById("captchaInput").value.trim();

    if (!name || !user || !phone || !pass || !captcha) {
        alert("Fill all fields!");
        return;
    }

    if (parseInt(captcha) !== captchaAnswer) {
        alert("Wrong captcha!");
        generateCaptcha();
        return;
    }

    localStorage.setItem("user", user);
    localStorage.setItem("pass", pass);
    localStorage.setItem("name", name);
    localStorage.setItem("phone", country + phone);

    alert("Signup Successful!");
    showLogin();
}

function login() {
    let u = document.getElementById("luser").value.trim();
    let p = document.getElementById("lpass").value.trim();

    let su = localStorage.getItem("user");
    let sp = localStorage.getItem("pass");

    if (u === su && p === sp) {
        hideAll();
        document.getElementById("dashboard").style.display = "block";

        let name = localStorage.getItem("name");
        let phone = localStorage.getItem("phone");

        document.getElementById("userData").innerText =
            "Name: " + name + "\nPhone: " + phone;
    } else {
        alert("Wrong Login!");
    }
}

function logout() {
    hideAll();
    document.getElementById("mainBtns").style.display = "block";
}

function goBack() {
    hideAll();
    document.getElementById("mainBtns").style.display = "block";
}

function hideAll() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("mainBtns").style.display = "none";
}
</script>

</body>
</html>
