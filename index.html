<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* PREMIUM DARK GRADIENT */
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

/* Container */
.container {
    text-align: center;
}

/* LOGO */
.logo {
    font-size: 60px;
    font-weight: 600;
    color: white;
    margin-bottom: 70px;
    letter-spacing: 1px;
}

.logo span {
    color: #00f2fe; /* unique glow accent */
}

/* Buttons */
.btn {
    width: 260px;
    padding: 15px;
    margin: 12px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    border: none;
    transition: 0.3s;
}

/* Login */
.login {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.6);
    color: white;
}

/* Signup */
.signup {
    background: linear-gradient(45deg, #2ecc71, #00f2fe);
    color: #0f2027;
    font-weight: bold;
}

/* Hover */
.btn:hover {
    transform: scale(1.05);
}

/* Glow effect */
.signup:hover {
    box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">Ba<span>z</span>i Bet</div>

    <button class="btn login">Login</button>
    <button class="btn signup">Sign Up</button>
</div>

</body>
</html>
