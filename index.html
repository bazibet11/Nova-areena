<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* UNIQUE SHADE */
    background: linear-gradient(135deg, #16c79a, #0f9b8e, #2af598);
}

/* Container */
.container {
    text-align: center;
}

/* LOGO */
.logo {
    font-size: 60px;
    font-weight: bold;
    color: white;
    margin-bottom: 60px;
    letter-spacing: 1px;
}

.logo span {
    color: #ff3b3b;
}

/* Buttons */
.btn {
    width: 260px;
    padding: 16px;
    margin: 12px;
    font-size: 18px;
    border-radius: 14px;
    cursor: pointer;
    border: none;
    transition: 0.3s;
}

/* Login button */
.login {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.8);
    color: white;
}

/* Signup button */
.signup {
    background: linear-gradient(45deg, #ff9a00, #ffd000);
    color: white;
}

/* Hover */
.btn:hover {
    transform: scale(1.05);
}

.signup:hover {
    box-shadow: 0 0 25px rgba(255, 200, 0, 0.8);
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">Ba<span>z</span>i Bet</div>

    <button class="btn login">Login</button>
    <button class="btn signup">Sign Up</button>
</div>

</body>
</html>
