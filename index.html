<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    background: radial-gradient(circle at top, #001a22, #000);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    width: 95%;
    max-width: 400px;
    padding: 25px;
    border-radius: 25px;
    background: #0a0a0a;
    box-shadow: 0 0 40px rgba(0,255,255,0.5);
    color: white;
}

/* LOGO (GAMING STYLE) */
.logo {
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 20px;

    background: linear-gradient(45deg, #00f2fe, #00c6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 10px #00f2fe,
        0 0 20px #00c6ff,
        0 0 40px #00c6ff;
}

/* BUTTONS */
.btn {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login {
    background: linear-gradient(45deg,#00c6ff,#0072ff);
}

.signup {
    background: linear-gradient(45deg,#ff7b00,#ff3c00);
}

/* INPUT */
.input-box {
    position: relative;
    margin-top: 12px;
}

.input-box input, select {
    width: 100%;
    padding: 12px 40px 12px 12px;
    border-radius: 10px;
    border: none;
    background: #111;
    color: #fff;
}

/* FIXED EYE */
.eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
}

/* FORM */
.form-box {display:none;}

/* CAPTCHA */
.captcha {
    background:#111;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    text-align:center;
}

/* BACK */
.back {
    text-align:center;
    margin-top:10px;
    cursor:pointer;
    opacity:0.7;
}

/* DASHBOARD */
.dashboard {display:none;}
</style>
</head>

<body>

<div class="card">

<div class="logo">BAZI BET</div>

<div id="mainBtns">
<button class="btn login" onclick="showLogin()">LOGIN</button>
<button class="btn signup" onclick="showSignup()">SIGN UP</button>
</div>

<!-- LOGIN -->
<div id="loginForm" class="form-box">
<div class="input-box">
<input id="luser" placeholder="Username">
</div>

<div class="input-box">
<input type="password" id="lpass" placeholder="Password">
<span class="eye" onclick="togglePass('lpass')">👁</span>
</div>

<button class="btn login" onclick="login()">ENTER</button>
<div class="back" onclick="goBack()">⬅ Back</div>
</div>

<!-- SIGNUP -->
<div id="signupForm" class="form-box">

<div class="input-box">
<input id="name" placeholder="Full Name">
</div>

<div class="input-box">
<input id="user" placeholder="Username">
</div>

<div class="input-box">
<select id="country">
<option value="+971">UAE (+971)</option>
<option value="+880">Bangladesh (+880)</option>
<option value="+91">India (+91)</option>
<option value="+92">Pakistan (+92)</option>
</select>
</div>

<div class="input-box">
<input id="phone" placeholder="Phone Number">
</div>

<div class="input-box">
<input type="password" id="pass" placeholder="Password">
<span class="eye" onclick="togglePass('pass')">👁</span>
</div>

<div class="captcha" id="cap"></div>
<input id="capInput" placeholder="Enter captcha">

<button class="btn signup" onclick="signup()">CREATE ACCOUNT</button>
<div class="back" onclick="goBack()">⬅ Back</div>
</div>

<!-- DASH -->
<div id="dashboard" class="dashboard">
<h2>🎮 Welcome Player</h2>
<button class="btn" onclick="logout()">Logout</button>
</div>

</div>

<script>
let ans=0;

function genCap(){
let a=Math.floor(Math.random()*10);
let b=Math.floor(Math.random()*10);
ans=a+b;
cap.innerText=a+" + "+b;
}

function togglePass(id){
let x=document.getElementById(id);
x.type=x.type==="password"?"text":"password";
}

function showLogin(){
hideAll();
loginForm.style.display="block";
}

function showSignup(){
hideAll();
signupForm.style.display="block";
genCap();
}

function signup(){
if(parseInt(capInput.value)!==ans){
alert("Wrong captcha"); return;
}
localStorage.setItem("user",user.value);
localStorage.setItem("pass",pass.value);
alert("Account Created");
showLogin();
}

function login(){
if(luser.value===localStorage.getItem("user") &&
lpass.value===localStorage.getItem("pass")){
hideAll();
dashboard.style.display="block";
}
else alert("Wrong login");
}

function logout(){
hideAll();
mainBtns.style.display="block";
}

function goBack(){
hideAll();
mainBtns.style.display="block";
}

function hideAll(){
loginForm.style.display="none";
signupForm.style.display="none";
dashboard.style.display="none";
mainBtns.style.display="none";
}
</script>

</body>
</html>
