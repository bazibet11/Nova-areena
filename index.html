<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* GLASS CARD */
.card {
    width: 320px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    text-align: center;
    color: white;
}

h1 {
    margin-bottom: 20px;
    font-size: 32px;
    letter-spacing: 2px;
}

/* BUTTONS */
.btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.login {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
}

.signup {
    background: linear-gradient(45deg, #ff7b00, #ff3c00);
}

.btn:hover {
    transform: scale(1.05);
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
}

/* HIDE FORMS */
.form {
    display: none;
}

/* DASHBOARD */
.dashboard {
    display: none;
}

.big-text {
    font-size: 22px;
    margin-top: 20px;
}
</style>

</head>
<body>

<div class="card">

    <h1>BAZI BET</h1>

    <div id="mainBtns">
        <button class="btn login" onclick="showLogin()">Login</button>
        <button class="btn signup" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div id="loginForm" class="form">
        <input type="text" id="luser" placeholder="Username">
        <input type="password" id="lpass" placeholder="Password">
        <button class="btn login" onclick="login()">Enter</button>
    </div>

    <!-- SIGNUP -->
    <div id="signupForm" class="form">
        <input type="text" id="suser" placeholder="Username">
        <input type="password" id="spass" placeholder="Password">
        <button class="btn signup" onclick="signup()">Create Account</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <div class="big-text">🎉 Welcome</div>
        <p id="name"></p>
        <button class="btn" onclick="logout()">Logout</button>
    </div>

</div>

<script>
function showLogin() {
    hideAll();
    document.getElementById("loginForm").style.display = "block";
}

function showSignup() {
    hideAll();
    document.getElementById("signupForm").style.display = "block";
}

function signup() {
    let u = document.getElementById("suser").value;
    let p = document.getElementById("spass").value;

    localStorage.setItem("user", u);
    localStorage.setItem("pass", p);

    alert("Account Created!");
    showLogin();
}

function login() {
    let u = document.getElementById("luser").value;
    let p = document.getElementById("lpass").value;

    let su = localStorage.getItem("user");
    let sp = localStorage.getItem("pass");

    if (u === su && p === sp) {
        hideAll();
        document.getElementById("dashboard").style.display = "block";
        document.getElementById("name").innerText = u;
    } else {
        alert("Wrong details!");
    }
}

function logout() {
    hideAll();
    document.getElementById("mainBtns").style.display = "block";
}

function hideAll() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("mainBtns").style.display = "none";
}
</script>

</body>
</html>
