<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* MAIN CARD */
.card {
    width: 90%;
    max-width: 380px;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    text-align: center;
    color: white;
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

h1 {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

/* BUTTONS */
.btn {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

.login {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
}

.signup {
    background: linear-gradient(45deg, #ff7b00, #ff3c00);
    color: white;
}

.btn:hover {
    transform: scale(1.06);
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
}

/* FORMS */
.form {
    display: none;
    animation: fadeIn 0.4s ease;
}

.back {
    margin-top: 15px;
    font-size: 14px;
    cursor: pointer;
    opacity: 0.7;
}

.back:hover {
    opacity: 1;
}

/* DASHBOARD */
.dashboard {
    display: none;
}

.big-text {
    font-size: 24px;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="card">

    <h1>BAZI BET</h1>

    <!-- MAIN BUTTONS -->
    <div id="mainBtns">
        <button class="btn login" onclick="showLogin()">LOGIN</button>
        <button class="btn signup" onclick="showSignup()">SIGN UP</button>
    </div>

    <!-- LOGIN -->
    <div id="loginForm" class="form">
        <input type="text" id="luser" placeholder="Username">
        <input type="password" id="lpass" placeholder="Password">
        <button class="btn login" onclick="login()">ENTER</button>
        <div class="back" onclick="goBack()">⬅ Back</div>
    </div>

    <!-- SIGNUP -->
    <div id="signupForm" class="form">
        <input type="text" id="suser" placeholder="Username">
        <input type="password" id="spass" placeholder="Password">
        <button class="btn signup" onclick="signup()">CREATE ACCOUNT</button>
        <div class="back" onclick="goBack()">⬅ Back</div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <div class="big-text">🎉 Welcome</div>
        <p id="name"></p>
        <button class="btn" onclick="logout()">Logout</button>
    </div>

</div>

<script>
function showLogin() {
    hideAll();
    document.getElementById("loginForm").style.display = "block";
}

function showSignup() {
    hideAll();
    document.getElementById("signupForm").style.display = "block";
}

function signup() {
    let u = document.getElementById("suser").value.trim();
    let p = document.getElementById("spass").value.trim();

    if (u === "" || p === "") {
        alert("Fill all fields!");
        return;
    }

    localStorage.setItem("user", u);
    localStorage.setItem("pass", p);

    alert("Account Created Successfully!");
    showLogin();
}

function login() {
    let u = document.getElementById("luser").value.trim();
    let p = document.getElementById("lpass").value.trim();

    let su = localStorage.getItem("user");
    let sp = localStorage.getItem("pass");

    if (u === su && p === sp) {
        hideAll();
        document.getElementById("dashboard").style.display = "block";
        document.getElementById("name").innerText = "User: " + u;
    } else {
        alert("Wrong Username or Password!");
    }
}

function logout() {
    hideAll();
    document.getElementById("mainBtns").style.display = "block";
}

function goBack() {
    hideAll();
    document.getElementById("mainBtns").style.display = "block";
}

function hideAll() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("mainBtns").style.display = "none";
}
</script>

</body>
</html>
