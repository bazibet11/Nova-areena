<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bazi Bet</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* Landing */
.landing{
  text-align:center;
}

.logo{
  font-size:40px;
  font-weight:800;
  margin-bottom:30px;
}

.logo span{
  color:#00e6ff;
}

/* Buttons */
.btn{
  width:220px;
  padding:14px;
  margin:10px;
  border-radius:30px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  border:none;
  transition:0.3s;
}

.loginBtn{
  background:transparent;
  border:2px solid white;
  color:white;
}

.loginBtn:hover{
  background:white;
  color:black;
}

.signupBtn{
  background: linear-gradient(45deg,#00c6ff,#00ffcc);
  color:black;
}

.signupBtn:hover{
  opacity:0.8;
}

/* Form */
.formBox{
  display:none;
  width:90%;
  max-width:350px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:16px;
}

/* Submit button */
.submit{
  background: linear-gradient(45deg,#00c6ff,#00ffcc);
  color:black;
  font-weight:bold;
  cursor:pointer;
}

/* Back */
.link{
  margin-top:10px;
  text-align:center;
  cursor:pointer;
  color:#00e6ff;
}
</style>

</head>

<body>

<!-- LANDING -->
<div class="landing" id="landing">
  <div class="logo">Ba<span>z</span>i Bet</div>

  <button class="btn loginBtn" onclick="openForm('login')">Login</button>
  <button class="btn signupBtn" onclick="openForm('signup')">Sign Up</button>
</div>

<!-- FORM -->
<div class="formBox" id="formBox">

  <div class="logo">Ba<span>z</span>i Bet</div>

  <!-- Login Fields -->
  <div id="loginFields">
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
  </div>

  <!-- Signup Fields -->
  <div id="signupFields">
    <input type="text" placeholder="Username">
    <input type="text" placeholder="Phone Number">
    <input type="password" placeholder="Password">
  </div>

  <!-- Captcha -->
  <div id="captchaText"></div>
  <input type="text" id="captchaInput" placeholder="Enter Captcha">

  <button class="btn submit" onclick="submit()">Submit 🚀</button>

  <div class="link" onclick="back()">← Back</div>

</div>

<script>

let mode = "login";
let captcha = "";

function generateCaptcha(){
  captcha = Math.floor(1000 + Math.random()*9000);
  document.getElementById("captchaText").innerText = "Captcha: " + captcha;
}

function openForm(type){
  mode = type;

  document.getElementById("landing").style.display="none";
  document.getElementById("formBox").style.display="block";

  if(type === "login"){
    document.getElementById("loginFields").style.display="block";
    document.getElementById("signupFields").style.display="none";
  }else{
    document.getElementById("loginFields").style.display="none";
    document.getElementById("signupFields").style.display="block";
  }

  generateCaptcha();
}

function back(){
  document.getElementById("landing").style.display="block";
  document.getElementById("formBox").style.display="none";
}

function submit(){
  let userCaptcha = document.getElementById("captchaInput").value;

  if(userCaptcha != captcha){
    alert("Wrong Captcha ❌");
  }else{
    alert(mode.toUpperCase() + " Success ✅");
  }
}

</script>

</body>
</html>
