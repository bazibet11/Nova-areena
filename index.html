<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* LANDING */
.landing{
    text-align:center;
}

/* LOGO */
.logo{
    font-size:60px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:60px;
    text-shadow:0 0 20px rgba(0,242,254,0.4);
}
.logo span{
    color:#00f2fe;
}

/* BUTTONS */
.btn{
    width:240px;
    padding:14px;
    margin:10px;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    transition:0.3s;
}

.loginBtn{
    background:transparent;
    border:2px solid white;
    color:white;
}

.signupBtn{
    background:linear-gradient(45deg,#2ecc71,#00f2fe);
    color:#0f2027;
    font-weight:bold;
}

.btn:hover{
    transform:scale(1.05);
}

/* FORM */
.formBox{
    display:none;
    width:300px;
    text-align:center;
    animation:fade 0.3s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
}

/* SUBMIT */
.submit{
    background:linear-gradient(45deg,#2ecc71,#00f2fe);
    color:#0f2027;
    font-weight:bold;
}

/* LINK */
.link{
    margin-top:10px;
    color:#00f2fe;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- LANDING -->
<div class="landing" id="landing">
    <div class="logo">Ba<span>z</span>i Bet</div>

    <button class="btn loginBtn" onclick="openForm('login')">Login</button>
    <button class="btn signupBtn" onclick="openForm('signup')">Sign Up</button>
</div>

<!-- FORM -->
<div class="formBox" id="formBox">
    <div class="logo">Ba<span>z</span>i Bet</div>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <div id="captchaText"></div>
    <input id="captchaInput" placeholder="Enter Captcha">

    <button class="btn submit" onclick="submit()">Submit</button>
    <div class="link" onclick="back()">⬅ Back</div>
</div>

<script>
let mode="login";
let captcha="";

/* CAPTCHA */
function generateCaptcha(){
    captcha = Math.floor(1000 + Math.random()*9000);
    document.getElementById("captchaText").innerText = "Captcha: " + captcha;
}

/* OPEN FORM */
function openForm(type){
    mode = type;
    document.getElementById("landing").style.display="none";
    document.getElementById("formBox").style.display="block";
    generateCaptcha();
}

/* BACK */
function back(){
    document.getElementById("landing").style.display="block";
    document.getElementById("formBox").style.display="none";
}

/* SUBMIT */
function submit(){
    let u=document.getElementById("user").value;
    let p=document.getElementById("pass").value;
    let c=document.getElementById("captchaInput").value;

    if(!u || !p){
        alert("Fill all fields");
        return;
    }

    if(c != captcha){
        alert("Wrong captcha");
        generateCaptcha();
        return;
    }

    if(mode==="signup"){
        localStorage.setItem(u,p);
        alert("Account Created ✅");
    }else{
        if(localStorage.getItem(u)===p){
            alert("Login Success 🎉");
        }else{
            alert("Wrong login ❌");
        }
    }
}
</script>

</body>
</html>
