<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazi Bet</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #001f2f, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.card {
    width: 95%;
    max-width: 400px;
    padding: 20px;
    border-radius: 25px;
    background: #0a0a0a;
    box-shadow: 0 0 40px rgba(0,198,255,0.6);
    color: white;
}

/* LOGO IMAGE */
.logo {
    text-align: center;
    margin-bottom: 10px;
}

.logo img {
    width: 140px;
}

/* BANNER */
.banner {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 15px;
}

/* BUTTONS */
.btn {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login {background: linear-gradient(45deg,#00c6ff,#0072ff);}
.signup {background: linear-gradient(45deg,#ff7b00,#ff3c00);}

/* INPUT */
.input-box {
    position: relative;
    margin-top: 10px;
}

.input-box input, select {
    width: 100%;
    padding: 12px 40px 12px 12px;
    border-radius: 10px;
    border: none;
    background: #111;
    color: white;
}

/* EYE FIX */
.eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
}

/* FORM */
.form-box {display:none;}

/* CAPTCHA */
.captcha {
    background:#111;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    text-align:center;
}

/* BACK */
.back {
    text-align:center;
    margin-top:10px;
    cursor:pointer;
}

/* DASH */
.dashboard {display:none;}
</style>
</head>

<body>

<div class="card">

<!-- LOGO -->
<div class="logo">
<img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
</div>

<!-- BANNER -->
<img class="banner" src="https://images.unsplash.com/photo-1606813909355-d1b0c0b3bcd5">

<div id="mainBtns">
<button class="btn login" onclick="showLogin()">LOGIN</button>
<button class="btn signup" onclick="showSignup()">SIGN UP</button>
</div>

<!-- LOGIN -->
<div id="loginForm" class="form-box">
<div class="input-box">
<input id="luser" placeholder="Username">
</div>

<div class="input-box">
<input type="password" id="lpass" placeholder="Password">
<span class="eye" onclick="togglePass('lpass')">👁</span>
</div>

<button class="btn login" onclick="login()">ENTER</button>
<div class="back" onclick="goBack()">⬅ Back</div>
</div>

<!-- SIGNUP -->
<div id="signupForm" class="form-box">

<div class="input-box">
<input id="name" placeholder="Full Name">
</div>

<div class="input-box">
<input id="user" placeholder="Username">
</div>

<div class="input-box">
<select id="country">
<option value="+971">UAE (+971)</option>
<option value="+880">Bangladesh (+880)</option>
<option value="+91">India (+91)</option>
<option value="+92">Pakistan (+92)</option>
</select>
</div>

<div class="input-box">
<input id="phone" placeholder="Phone Number">
</div>

<div class="input-box">
<input type="password" id="pass" placeholder="Password">
<span class="eye" onclick="togglePass('pass')">👁</span>
</div>

<div class="captcha" id="cap"></div>
<input id="capInput" placeholder="Enter captcha">

<button class="btn signup" onclick="signup()">CREATE ACCOUNT</button>
<div class="back" onclick="goBack()">⬅ Back</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
<h2>Welcome 🎉</h2>
<p id="info"></p>
<button class="btn" onclick="logout()">Logout</button>
</div>

</div>

<script>
let ans=0;

function genCap(){
let a=Math.floor(Math.random()*10);
let b=Math.floor(Math.random()*10);
ans=a+b;
document.getElementById("cap").innerText=a+" + "+b;
}

function togglePass(id){
let x=document.getElementById(id);
x.type=x.type==="password"?"text":"password";
}

function showLogin(){
hideAll();
document.getElementById("loginForm").style.display="block";
}

function showSignup(){
hideAll();
document.getElementById("signupForm").style.display="block";
genCap();
}

function signup(){
let cap=document.getElementById("capInput").value;
if(parseInt(cap)!==ans){alert("Wrong captcha");return;}

localStorage.setItem("user",user.value);
localStorage.setItem("pass",pass.value);

alert("Signup done");
showLogin();
}

function login(){
if(luser.value===localStorage.getItem("user") &&
lpass.value===localStorage.getItem("pass")){
hideAll();
dashboard.style.display="block";
}
else alert("Wrong login");
}

function logout(){
hideAll();
mainBtns.style.display="block";
}

function goBack(){
hideAll();
mainBtns.style.display="block";
}

function hideAll(){
loginForm.style.display="none";
signupForm.style.display="none";
dashboard.style.display="none";
mainBtns.style.display="none";
}
</script>

</body>
</html>
